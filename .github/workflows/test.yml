# テストの自動実行（yorozu-craft の README「ツールを追加するとき」17）。push と PR のたびに node --test を走らせる
# 規則のテストは Node 版の解析器（devDependencies の lindera-wasm-nodejs-ipadic）を使うので npm ci してから
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: node --test tests/*.test.js
